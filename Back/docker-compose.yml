networks:
  app-network:
    driver: bridge

services:
  # Nota: cada .env local usa "localhost" para llamar a los otros microservicios (asi
  # funciona igual corriendo cada uno suelto con "npm run dev"/"node src/index.js"). Al
  # levantar todo con docker-compose, "localhost" ya no sirve entre contenedores -- por
  # eso "environment:" pisa esas URLs con el nombre del servicio dentro de app-network.
  gestion_caja:
    build: ./servicios/gestion_caja
    ports:
      - "4004:4004"
    environment:
      - NODE_ENV=development
      - PORT=4004
      - FACTURACION_URL=http://facturacion:4002
      - GESTION_PAGOS_URL=http://gestion_pagos:4005
    env_file:
      - ./servicios/gestion_caja/.env
    networks:
      - app-network

  gestion_pagos:
    build: ./servicios/gestion_pagos
    ports:
      - "4005:4005"
    environment:
      - NODE_ENV=development
      - PORT=4005
      - FACTURACION_URL=http://facturacion:4002
      - GESTION_CAJA_URL=http://gestion_caja:4004
    env_file:
      - ./servicios/gestion_pagos/.env
    networks:
      - app-network

  facturacion:
    build: ./servicios/facturacion
    ports:
      - "4002:4002"
    environment:
      - NODE_ENV=development
      - PORT=4002
    env_file:
      - ./servicios/facturacion/.env
    networks:
      - app-network

  pagos_proveedores:
    build: ./servicios/pagos_proveedores
    ports:
      - "4006:4006"
    environment:
      - NODE_ENV=development
      - PORT=4006
      - GESTION_PAGOS_URL=http://gestion_pagos:4005
    env_file:
      - ./servicios/pagos_proveedores/.env
    networks:
      - app-network

  frontend:
    build: ../Frontend
    ports:
      - "5173:5173"
    env_file:
      - ../Frontend/.env
    networks:
      - app-network
    depends_on:
      - gestion_caja
      - gestion_pagos
      - facturacion
      - pagos_proveedores